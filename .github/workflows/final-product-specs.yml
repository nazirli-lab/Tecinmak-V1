name: Final product specs
on: [push]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make D100 specs match supplier page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('product-d100.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<h2 class="text-2xl font-extrabold mt-8 mb-3">Технические характеристики</h2>')
          end=s.index('<h2 class="text-2xl font-extrabold mt-8 mb-3">Возможности применения</h2>', start)
          block='''<h2 class="text-2xl font-extrabold mt-8 mb-3">Технические характеристики — ÖZGÜMAK</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-5"><div class="border border-gray-200 rounded-xl overflow-hidden"><div class="spec-row"><span>Delme kapasitesi</span><strong>Ø 18</strong></div><div class="spec-row"><span>Tutucu tipi</span><strong>ER32 / DIN 6499</strong></div><div class="spec-row"><span>Elektrik motor (standart)</span><strong>1.1 KW</strong></div><div class="spec-row"><span>Elektrik motor (max.)</span><strong>2.2 KW</strong></div><div class="spec-row"><span>Max.Dev/Dak</span><strong>3000 rpm</strong></div><div class="spec-row"><span>Ağırlık</span><strong>75 kg</strong></div><div class="spec-row"><span>Toplam strok</span><strong>0 - 100</strong></div></div><div class="border border-gray-200 rounded-xl overflow-hidden"><div class="spec-row"><span>Delme stroku</span><strong>0 - 90</strong></div><div class="spec-row"><span>Silindir ön çapı</span><strong>Ø85-Ø70</strong></div><div class="spec-row"><span>Silindir arka çapı</span><strong>Ø85-Ø35</strong></div><div class="spec-row"><span>Pnömatik basınç</span><strong>6 bar</strong></div><div class="spec-row"><span>Hava girişi</span><strong>R ¼ “-Ø6/8-Ø4/6</strong></div><div class="spec-row"><span>Hava tüketimi</span><strong>0,30 l/cm strok</strong></div><div class="spec-row"><span>Silindir alanı</span><strong>Ön: 000 / Arka: 000</strong></div><div class="spec-row"><span>Kayış</span><strong>Poly V_280 J – 300 J</strong></div><div class="spec-row"><span>İtme gücü</span><strong>6 bar-2880N</strong></div></div></div>\n    '''
          s=s[:start]+block+s[end:]
          s=s.replace('subsub=avtomatizaciya_mexanika_2&subsubsub=avtomatizaciya_mexanika_0','subsub=avtomatizaciya_mexanika_2&subsubsub=avtomatizaciya_mexanika_2_0')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-d100.html
          git commit -m 'Match D100 specs to supplier website'
          git push
