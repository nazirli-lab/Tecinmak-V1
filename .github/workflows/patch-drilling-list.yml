name: Update drilling units list
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Update drilling units list') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch drilling units section and URL handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('subpage.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('    /* TECINMAK_DRILLING_LIST_V2 */')
          end=s.index('\n  function renderPage()', start)
          new=r'''    /* TECINMAK_DRILLING_LIST_V3 */
    function renderDrillingUnits(){
      const units=[
        {name:'Сверлильная головка D100',img:'https://www.ozgumak.com/images/product/5a3a470c-e0bc-.jpg',specs:[['Максимальный диаметр сверления','Ø 18'],['Тип цанги','ER32 / DIN 6499'],['Двигатель','1,1 кВт / 2,2 кВт макс.'],['Максимальная частота вращения','3000 об/мин'],['Масса','75 кг'],['Общий ход','0–100 мм'],['Ход сверления','0–90 мм']],href:'product-d100.html'},
        {name:'Сверлильная головка D90',img:'https://www.ozgumak.com/images/product/604bff54-5c28-.jpg',specs:[['Максимальный диаметр сверления','Ø 16 (по стали)'],['Тип цанги','ER32 / DIN6499'],['Двигатель','0,75 кВт / 1,1 кВт макс.'],['Максимальная частота вращения','3000 об/мин'],['Масса','60 кг'],['Общий ход','0–100 мм'],['Ход сверления','0–90 мм']],href:'product-d90.html'},
        {name:'Сверлильная головка D75',img:'https://www.ozgumak.com/images/product/7dd0f217-4551-.jpg',specs:[['Максимальный диаметр сверления','Ø 12 (по стали)'],['Тип цанги','ER25 / DIN 6499'],['Двигатель','0,55 кВт / 0,75 кВт макс.'],['Максимальная частота вращения','4000 об/мин'],['Масса','45 кг'],['Общий ход','0–80 мм'],['Ход сверления','0–50 мм']],href:'product-d75.html'},
        {name:'Сверлильная головка D60',img:'https://www.ozgumak.com/images/product/c6248c5b-ea0d-.jpg',specs:[['Максимальный диаметр сверления','Ø 6 мм (по стали)'],['Тип цанги','ER16 / DIN 6499'],['Двигатель','0,37 кВт / 0,55 кВт макс.'],['Максимальная частота вращения','4000 об/мин'],['Масса','35 кг'],['Общий ход','0–50 мм'],['Ход сверления','0–30 мм']],href:'product-d60.html'}
      ];
      const cards=units.map(u=>`<a href="${u.href}" class="no-underline block"><div class="sub-item-card h-full"><img src="${u.img}" alt="${u.name}" onerror="this.src='https://placehold.co/600x320/f3f4f6/888?text=${encodeURIComponent(u.name)}'"><div class="card-title">${u.name}</div><div class="px-4 pb-4">${u.specs.map(x=>`<div class="flex justify-between gap-3 border-b border-gray-100 py-1.5 text-xs"><span class="text-gray-500">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="text-center pb-4"><span class="bg-orange-500 text-white rounded-lg px-4 py-2 text-xs font-bold">ПОДРОБНЫЕ ХАРАКТЕРИСТИКИ →</span></div></div></a>`).join('');
      container.innerHTML=`<a href="subpage.html?cat=avtomatizaciya&sub=mexanika" class="back-btn">← МЕХАНИЧЕСКАЯ ОБРАБОТКА</a><h1 class="subpage-title mt-2">СВЕРЛИЛЬНЫЕ ГОЛОВКИ</h1><p class="breadcrumb">АВТОМАТИЗАЦИЯ / МЕХАНИЧЕСКАЯ ОБРАБОТКА / СТАНДАРТНЫЕ УЗЛЫ / СВЕРЛИЛЬНЫЕ ГОЛОВКИ</p><p class="description">Четыре модели. Выберите модель по изображению и кратким техническим характеристикам.</p><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mt-6">${cards}</div>`;
    }
'''
          s=s[:start]+new+s[end:]
          old="params.subsub === 'avtomatizaciya_mexanika_2' && params.subsubsub === 'avtomatizaciya_mexanika_2_0'"
          newcond="params.subsub === 'avtomatizaciya_mexanika_2' && (params.subsubsub === 'avtomatizaciya_mexanika_2_0' || params.subsubsub === 'avtomatizaciya_mexanika_0')"
          if old not in s:
              raise SystemExit('Expected drilling URL condition not found')
          s=s.replace(old,newcond,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subpage.html
          git commit -m 'Update drilling units list'
          git push
