name: Patch D60 product link
on: [push]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Patch D60 link') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('subpage.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("href:'product-d100.html?model=D60'", "href:'product-d60.html'")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subpage.html
          git commit -m 'Patch D60 link'
          git push
