name: Inspect D75 supplier page
on: [workflow_dispatch]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch D75 page
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u='https://www.ozgumak.com/details/7/3/-d-75-delme-unitesi'
          r=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS',r.status_code,'URL',r.url,'LEN',len(r.text))
          soup=BeautifulSoup(r.text,'html.parser')
          text='\n'.join(x.strip() for x in soup.stripped_strings)
          i=text.find('TEKNİK ÖZELLİKLER')
          print(text[i:i+5000])
          PY
