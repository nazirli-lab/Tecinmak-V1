name: Inspect D75 supplier page
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, 'Capture D75 source') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and capture D75 supplier data
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          u='https://www.ozgumak.com/details/7/3/-d-75-delme-unitesi'
          r=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS',r.status_code,'URL',r.url,'LEN',len(r.text))
          soup=BeautifulSoup(r.text,'html.parser')
          text='\n'.join(x.strip() for x in soup.stripped_strings)
          i=text.find('TEKNİK ÖZELLİKLER')
          block=text[i:i+5000]
          print(block)
          Path('d75-source.txt').write_text(block,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add d75-source.txt
          git commit -m 'Capture D75 source'
          git push
