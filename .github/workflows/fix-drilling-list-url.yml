name: Fix drilling list URL
on:
  push:
    branches: [main]
    paths:
      - 'subpage.html'
      - '.github/workflows/fix-drilling-list-url.yml'
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix drilling list URL')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix URL condition and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('subpage.html')
          s = p.read_text(encoding='utf-8')
          old = "params.subsub === 'avtomatizaciya_mexanika_2' && params.subsubsub === 'avtomatizaciya_mexanika_2_0'"
          new = "params.subsub === 'avtomatizaciya_mexanika_2' && (params.subsubsub === 'avtomatizaciya_mexanika_2_0' || params.subsubsub === 'avtomatizaciya_mexanika_0')"
          if old not in s:
              raise SystemExit('Expected condition not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-drilling-list-url.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subpage.html .github/workflows/fix-drilling-list-url.yml
          git commit -m 'Fix drilling list URL [skip ci]'
          git push
