name: Patch drilling units
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Patch drilling units') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalogue and D100 specs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('subpage.html')
          s=p.read_text(encoding='utf-8')
          marker='    // ===== TECINMAK DRILLING UNITS LIST ====='
          if marker not in s:
              insertion=r'''    // ===== TECINMAK DRILLING UNITS LIST =====
    function renderDrillingUnits() {
      const units = [
        {model:'D100',name:'D 100 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/5a3a470c-e0bc-.jpg',specs:[['Delme kapasitesi','Ø 18'],['Tutucu tipi','ER32 / DIN 6499'],['Elektrik motor (standart)','1.1 KW'],['Elektrik motor (max.)','2.2 KW'],['Max. Dev/Dak','3000 rpm'],['Ağırlık','75 kg'],['Toplam strok','0 - 100'],['Delme stroku','0 - 90']],href:'product-d100.html'},
        {model:'D90',name:'D 90 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/604bff54-5c28-.jpg',specs:[['Delme kapasitesi','Ø 16 (çelikte)'],['Tutucu tipi','ER32 / DIN6499'],['Pens tutma çapı','Ø 3...-..20'],['Elektrik motor (standart)','0.75 Kw'],['Elektrik motor (max.)','1.1 Kw'],['Max. Dev/Dak','3000 rpm'],['Ağırlık','60 kg'],['Toplam strok','0 - 100'],['Delme stroku','0 - 90']],href:'product-d100.html?model=D90'},
        {model:'D75',name:'D 75 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/7dd0f217-4551-.jpg',specs:[['Model','D 75'],['Ürün tipi','Delme Ünitesi'],['Tedarikçi','Özgümak']],href:'product-d100.html?model=D75'},
        {model:'D60',name:'D 60 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/c6248c5b-ea0d-.jpg',specs:[['Model','D 60'],['Ürün tipi','Delme Ünitesi'],['Tedarikçi','Özgümak']],href:'product-d100.html?model=D60'}
      ];
      const cards=units.map(u=>`<a href="${u.href}" class="no-underline block"><div class="sub-item-card h-full"><img src="${u.img}" alt="${u.name}" onerror="this.src='https://placehold.co/600x320/f3f4f6/888?text=${encodeURIComponent(u.name)}'"/><div class="card-title text-lg">${u.name}</div><div class="px-4 pb-4 space-y-1">${u.specs.map(x=>`<div class="flex justify-between gap-3 border-b border-gray-100 py-1.5 text-xs"><span class="text-gray-500">${x[0]}</span><strong class="text-gray-800 text-right">${x[1]}</strong></div>`).join('')}</div><div class="px-4 pb-4 text-center"><span class="inline-flex items-center gap-2 bg-orange-500 text-white rounded-lg px-4 py-2 text-xs font-extrabold">ДЕТАЛЬНЫЕ ХАРАКТЕРИСТИКИ <i class="fas fa-arrow-right"></i></span></div></div></a>`).join('');
      container.innerHTML=`<a href="subpage.html?cat=avtomatizaciya&sub=mexanika" class="back-btn"><i class="fas fa-arrow-left"></i> МЕХАНИЧЕСКАЯ ОБРАБОТКА</a><h1 class="subpage-title mt-2">СВЕРЛИЛЬНЫЕ ГОЛОВКИ</h1><p class="breadcrumb">АВТОМАТИЗАЦИЯ / МЕХАНИЧЕСКАЯ ОБРАБОТКА / СТАНДАРТНЫЕ УЗЛЫ / СВЕРЛИЛЬНЫЕ ГОЛОВКИ</p><p class="description max-w-4xl">Выберите сверлильную головку по модели. На карточках D100 и D90 приведены данные, опубликованные поставщиком. Нажмите на нужную модель для перехода к подробной странице.</p><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mt-6">${cards}</div><div class="mt-6 p-4 bg-orange-50 rounded-xl border-l-4 border-orange-500"><p class="text-sm text-gray-600"><i class="fas fa-info-circle text-orange-500 mr-2"></i> D75 и D60 пока показаны без числовых характеристик, чтобы не вводить клиента в заблуждение. Их числовые значения будут добавлены только после проверки соответствующей страницы/документации поставщика.</p></div>`;
    }

'''
              s=s.replace('  function renderPage() {',insertion+'  function renderPage() {',1)
          hook="    const container = document.getElementById('subpageContent');"
          target=hook+'''\n\n    // Show all four drilling-head models first.\n    if (params.cat === 'avtomatizaciya' && params.sub === 'mexanika' && params.subsub === 'avtomatizaciya_mexanika_2' && params.subsubsub === 'avtomatizaciya_mexanika_2_0') {\n      renderDrillingUnits();\n      return;\n    }'''
          if target not in s:
              s=s.replace(hook,target,1)
          p.write_text(s,encoding='utf-8')
          p=Path('product-d100.html')
          s=p.read_text(encoding='utf-8')
          reps={'Ø20 мм (сталь)':'Ø18','ISO 30 / DIN 2079':'ER32 / DIN 6499','1,1 кВт':'1.1 KW','2,2 кВт':'2.2 KW','4000 об/мин':'3000 rpm','60 мм':'90'}
          for a,b in reps.items(): s=s.replace(a,b)
          s=s.replace('<strong>100 мм</strong>','<strong>0 - 100</strong>')
          s=s.replace('<strong>75 кг</strong>','<strong>75 kg</strong>')
          s=s.replace('<strong>2880 Н при 6 бар</strong>','<strong>6 bar-2880N</strong>')
          s=s.replace('<strong>0,30 л/см хода</strong>','<strong>0,30 l/cm strok</strong>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subpage.html product-d100.html
          git diff --cached --quiet || git commit -m 'Patch drilling units'
          git push
