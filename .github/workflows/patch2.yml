name: Patch2
on: [push]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('subpage.html')
          s=p.read_text(encoding='utf-8')
          if 'TECINMAK_DRILLING_LIST_V2' not in s:
              block='''\n    /* TECINMAK_DRILLING_LIST_V2 */\n    function renderDrillingUnits(){\n      const units=[\n        {name:'D 100 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/5a3a470c-e0bc-.jpg',specs:[['Delme kapasitesi','Ø 18'],['Tutucu tipi','ER32 / DIN 6499'],['Motor','1.1 KW / 2.2 KW max.'],['Max. devir','3000 rpm'],['Ağırlık','75 kg'],['Toplam strok','0 - 100'],['Delme stroku','0 - 90']],href:'product-d100.html'},\n        {name:'D 90 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/604bff54-5c28-.jpg',specs:[['Delme kapasitesi','Ø 16 (çelikte)'],['Tutucu tipi','ER32 / DIN6499'],['Motor','0.75 Kw / 1.1 Kw max.'],['Max. devir','3000 rpm'],['Ağırlık','60 kg'],['Toplam strok','0 - 100'],['Delme stroku','0 - 90']],href:'product-d100.html?model=D90'},\n        {name:'D 75 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/7dd0f217-4551-.jpg',specs:[['Model','D 75'],['Ürün tipi','Delme Ünitesi']],href:'product-d100.html?model=D75'},\n        {name:'D 60 Delme Ünitesi',img:'https://www.ozgumak.com/images/product/c6248c5b-ea0d-.jpg',specs:[['Model','D 60'],['Ürün tipi','Delme Ünitesi']],href:'product-d100.html?model=D60'}];\n      const cards=units.map(u=>`<a href="${u.href}" class="no-underline block"><div class="sub-item-card h-full"><img src="${u.img}" alt="${u.name}" onerror="this.src='https://placehold.co/600x320/f3f4f6/888?text=${encodeURIComponent(u.name)}'"><div class="card-title">${u.name}</div><div class="px-4 pb-4">${u.specs.map(x=>`<div class="flex justify-between gap-3 border-b border-gray-100 py-1.5 text-xs"><span class="text-gray-500">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="text-center pb-4"><span class="bg-orange-500 text-white rounded-lg px-4 py-2 text-xs font-bold">ДЕТАЛЬНЫЕ ХАРАКТЕРИСТИКИ →</span></div></div></a>`).join('');\n      container.innerHTML=`<a href="subpage.html?cat=avtomatizaciya&sub=mexanika" class="back-btn">← МЕХАНИЧЕСКАЯ ОБРАБОТКА</a><h1 class="subpage-title mt-2">СВЕРЛИЛЬНЫЕ ГОЛОВКИ</h1><p class="breadcrumb">АВТОМАТИЗАЦИЯ / МЕХАНИЧЕСКАЯ ОБРАБОТКА / СТАНДАРТНЫЕ УЗЛЫ / СВЕРЛИЛЬНЫЕ ГОЛОВКИ</p><p class="description">Выберите модель по изображению и кратким характеристикам.</p><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mt-6">${cards}</div>`;\n    }\n'''
              s=s.replace('  function renderPage() {',block+'\n  function renderPage() {',1)
          hook="    const container = document.getElementById('subpageContent');"
          if "params.subsubsub === 'avtomatizaciya_mexanika_2_0'" not in s:
              s=s.replace(hook,hook+"\n\n    if (params.cat === 'avtomatizaciya' && params.sub === 'mexanika' && params.subsub === 'avtomatizaciya_mexanika_2' && params.subsubsub === 'avtomatizaciya_mexanika_2_0') { renderDrillingUnits(); return; }",1)
          p.write_text(s,encoding='utf-8')
          p=Path('product-d100.html')
          s=p.read_text(encoding='utf-8')
          for a,b in {'Ø20 мм (сталь)':'Ø18','ISO 30 / DIN 2079':'ER32 / DIN 6499','1,1 кВт':'1.1 KW','2,2 кВт':'2.2 KW','4000 об/мин':'3000 rpm'}.items(): s=s.replace(a,b)
          s=s.replace('<strong>100 мм</strong>','<strong>0 - 100</strong>').replace('<strong>60 мм</strong>','<strong>0 - 90</strong>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subpage.html product-d100.html
          git diff --cached --quiet || git commit -m 'Apply drilling units V2'
          git push
